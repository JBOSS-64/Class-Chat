<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Chat</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <div id = "auth-screen">
        <div class= "auth-card">
            <div id = login>
            <h2>Please log in to get started!</h2>
            <form id = "login-form">
                <input type = "email" id = "email-log-in" placeholder = "example@example.com" required>
                <input type = "password" id = "password-log-in" placeholder = "Password" required>
                <button type = "submit">Log In</button>
            </form>
            <h3>Need to make an account? <button class = "link-button" id = "sign-up-button">Sign Up</button></h3>
        </div>
        <div id = signup style = "display: none;">
            <h2>Please sign up to get started!</h2>
            <form id = "signup-form">
                <input type = "email" id = "email-sign-up" placeholder = "example@example.com" required>
                <input type = "password" id = "password-sign-up" placeholder = "Password" required>
                <input type = "password" id = "password-confirm" placeholder="Confirm Password" required>
                <p id = "error-text" style = "color:red; font-size: smaller; display: none;">Error: Passwords do not match</p>
                <button type = "submit">Sign Up</button>
            </form>
            <h3>Already have an account? <button class = "link-button" id = "log-in-button">Log In</button></h3>
            </div>
        </div>
    </div>
    <div id = "app-screen">
        <aside class="sidebar-left">
            <h2>Classes</h2>
            <ul id = "class-list">
                
            </ul>
            <button class = "class-button" id = "join-class">+ Join Class</button>
            <button class = "class-button" id = "create-class">+ Create Class</button>
            <div id = "profile-button">
                <img src = "default-pfps/grey.svg" class = "pfp" id = "profile-card-img">
                <span id = "username">Test</span>
            </div>
        </aside>
        <main id = "chat-area">
            <header id = "chat-header">
                <h3 id = "class-name"></h3>
            </header>

            <div id = "message-container">

            </div>

            <form id = "chat-input-area">
                <input type = "text" id = "message-input" autocomplete = "off" placeholder = "Type a message">
                <button type = "submit">Send</button>
            </form>
        </main>
        <aside class = "sidebar-right">
            <h3>Assignments</h3>
            <div id = "assignments-container">

            </div>
            <button class = "assignment-button" id = "create-assignment">+ Create Assignment</button>
        </aside>

    </div>
    <div id = "join-class-card" class = "card">
        <div class = "card-content">
        <h2>Input class code to join a class</h2>
            <form id = "join-class-form" autocomplete="off">
                <input type = "text" placeholder="Code" id = "join-class-code">
                <button type = "submit" id = "join-class-button">Join</button>
            </form>
        </div>
    </div>
    <div id = "create-class-card" class = "card">
        <div class = "card-content">
            <h2>Create a new class</h2>
            <form id = "create-class-form" autocomplete="off">
                <input type = "text" placeholder="Class name" id = "new-class-name">
                <input type = "text" placeholder="Subject" id = "new-class-subject">
                <button type="submit" id = "create-class-button">Create</button>
            </form>
        </div>
    </div>
    <div id = "create-assignment-card" class = "card">
        <div class = "card-content">
            <h2>Create new assignment</h2>
            <form id = "create-assignment-form" autocomplete="off">
                <input type = "text" placeholder = "Assignment name" id = "new-assignment-name">
                <input type = "text" placeholder = "Assignment description" id = "new-assignment-description">
                <select id = "assignment-class">
                    <option value = "" disabled selected>Choose a class...</option>
                </select>
                <input type = "datetime-local" id = "new-assignment-due-date">
                <button type = "submit" id = "create-new-assignment">Create Assignment</button>
            </form>
        </div>
    </div>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src = "app.js"></script>
</body>
</html>
